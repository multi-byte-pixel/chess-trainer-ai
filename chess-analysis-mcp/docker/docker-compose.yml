version: "3.9"

services:
  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "9000:9000"
    environment:
      LICHESS_TOKEN: ${LICHESS_TOKEN:-}
      STOCKFISH_PATH: /usr/games/stockfish
      DATABASE_URL: postgresql://chess:chess@postgres:5432/chess_analysis
      REDIS_URL: redis://redis:6379/0
      MCP_PORT: 9000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CHESSDB_API_URL: ${CHESSDB_API_URL:-https://chessdb.cn}
      CHESSDB_REQUEST_TIMEOUT: ${CHESSDB_REQUEST_TIMEOUT:-30}
      CHESSDB_CACHE_TTL: ${CHESSDB_CACHE_TTL:-86400}
      TABLEBASE_API_URL: ${TABLEBASE_API_URL:-https://tablebase.lichess.ovh}
      TABLEBASE_REQUEST_TIMEOUT: ${TABLEBASE_REQUEST_TIMEOUT:-15}
      TABLEBASE_CACHE_TTL: ${TABLEBASE_CACHE_TTL:-604800}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess_analysis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_analysis"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
